name: Build Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'registration-madix/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registration-madix/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/registration-madix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: registration-madix-debug
          path: registration-madix/android/app/build/outputs/apk/debug/registration-madix.apk
          if-no-files-found: warn

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: registration madix (latest)
          prerelease: true
          files: registration-madix/android/app/build/outputs/apk/debug/registration-madix.apk
