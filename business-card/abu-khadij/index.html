<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كرت أبو خديج</title>
<link rel="stylesheet" href="card.css">
</head>
<body>

<!-- رسومات مشتركة: الشعار وأيقونة الهاتف والتدرجات -->
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3a2f"/>
      <stop offset=".5" stop-color="#d7141c"/>
      <stop offset="1" stop-color="#86080d"/>
    </linearGradient>
    <linearGradient id="g-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4a4ad"/>
      <stop offset="1" stop-color="#5b5b63"/>
    </linearGradient>
    <linearGradient id="g-tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c3cb"/>
      <stop offset=".32" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b3b3bc"/>
    </linearGradient>
    <linearGradient id="g-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a2b"/>
      <stop offset="1" stop-color="#c70f16"/>
    </linearGradient>

    <!-- الشعار: سخان ماء بلهب ومفتاح ربط داخل دائرة -->
    <symbol id="emblem" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="49.2" fill="#0b0b0d"/>
      <circle cx="50" cy="50" r="46.6" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="43.4" fill="none" stroke="#d7141c" stroke-width="1"/>
      <g fill="url(#g-steel)" transform="rotate(45 50 50)">
        <path fill-rule="evenodd" d="M19 43.2a6.8 6.8 0 1 1 0 13.6a6.8 6.8 0 1 1 0-13.6zM19 47.1a2.9 2.9 0 1 0 0 5.8a2.9 2.9 0 1 0 0-5.8z"/>
        <rect x="24" y="46.8" width="50" height="6.4" rx="1"/>
        <path d="M88.788 53.8A10.5 10.5 0 1 1 88.788 46.2H82A3.8 3.8 0 0 0 82 53.8Z"/>
      </g>
      <rect x="39.5" y="15" width="5" height="12" fill="#d7141c"/>
      <rect x="37.5" y="13" width="9" height="4" rx="1.2" fill="#ff3a2f"/>
      <rect x="55.5" y="15" width="5" height="12" fill="#c9c9d0"/>
      <rect x="53.5" y="13" width="9" height="4" rx="1.2" fill="#fff"/>
      <rect x="39" y="78" width="6" height="7" rx="1.2" fill="#c9c9d0"/>
      <rect x="55" y="78" width="6" height="7" rx="1.2" fill="#c9c9d0"/>
      <rect x="34" y="25" width="32" height="56" rx="12" fill="url(#g-tank)"/>
      <circle cx="50" cy="41" r="6.6" fill="#0b0b0d"/>
      <circle cx="50" cy="41" r="4.5" fill="none" stroke="#fff" stroke-width="1.2"/>
      <path d="M50 41l3-3" stroke="#ff3a2f" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="50" cy="41" r="1.2" fill="#ff3a2f"/>
      <g transform="translate(42 53)">
        <path fill="url(#g-flame)" d="M8 0C9 4 15 7 15 13.5C15 18.5 11.8 22 8 22C4.2 22 1 18.5 1 14C1 10.5 3 8.5 4.5 6.5C5 9 6 10 7 10.5C6.5 6.5 7 3 8 0Z"/>
        <path fill="#fff" d="M8 10C9 12.5 11.5 14 11.5 17C11.5 19.5 9.8 21 8 21C6.2 21 4.5 19.5 4.5 17.3C4.5 15.3 5.8 14 6.6 13C6.9 14.2 7.4 14.8 8 15.1C7.6 13.3 7.6 11.6 8 10Z"/>
      </g>
    </symbol>

    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M7.2 2.5c.6 0 1.1.4 1.3 1l1.2 3.6c.2.5 0 1.1-.4 1.4L7.6 9.8c1.3 2.8 3.6 5.1 6.4 6.4l1.3-1.7c.3-.4.9-.6 1.4-.4l3.6 1.2c.6.2 1 .7 1 1.3v3.2c0 .9-.7 1.6-1.6 1.6C10.4 21.4 2.6 13.6 2.6 4.1c0-.9.7-1.6 1.6-1.6z"/>
    </symbol>
  </defs>
</svg>

<main class="sheet">

  <figure class="side">
    <section class="card front" aria-label="الوجه الأمامي">
      <div class="bg"></div>
      <svg class="art" viewBox="-3 -3 96 56" aria-hidden="true">
        <clipPath id="clip-panel"><polygon points="-3,-3 41,-3 29,53 -3,53"/></clipPath>
        <polygon points="-3,-3 41,-3 29,53 -3,53" fill="url(#g-panel)"/>
        <g clip-path="url(#clip-panel)" fill="none" stroke="#fff">
          <circle cx="16.5" cy="25" r="15.5" stroke-opacity=".16" stroke-width=".35"/>
          <circle cx="16.5" cy="25" r="20" stroke-opacity=".11" stroke-width=".35"/>
          <circle cx="16.5" cy="25" r="24.5" stroke-opacity=".07" stroke-width=".35"/>
          <circle cx="16.5" cy="25" r="29" stroke-opacity=".04" stroke-width=".35"/>
        </g>
        <polygon points="43.2,-3 44.5,-3 32.5,53 31.2,53" fill="#d7141c"/>
      </svg>
      <svg class="emblem" viewBox="0 0 100 100" role="img" aria-label="شعار سخان ماء"><use href="#emblem"/></svg>

      <div class="info">
        <h1 class="name">أبو خديج</h1>
        <p class="trade">لتصليح وصيانة السخانات</p>
        <span class="rule" aria-hidden="true"></span>
        <a class="phone" href="tel:0598820550">
          <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg></span>
          <span class="num" dir="ltr">059 88 20 550</span>
        </a>
        <p class="motto">لسنا الوحيدين... ولكننا <b>الأفضل</b></p>
      </div>
    </section>
    <figcaption class="label">الوجه الأمامي</figcaption>
  </figure>

  <figure class="side">
    <section class="card back" aria-label="الوجه الخلفي">
      <div class="bg"></div>
      <svg class="art" viewBox="-3 -3 96 56" aria-hidden="true">
        <g fill="none" stroke="#000">
          <circle cx="45" cy="15.5" r="14" stroke-opacity=".16" stroke-width=".35"/>
          <circle cx="45" cy="15.5" r="19" stroke-opacity=".12" stroke-width=".35"/>
          <circle cx="45" cy="15.5" r="24" stroke-opacity=".08" stroke-width=".35"/>
          <circle cx="45" cy="15.5" r="29" stroke-opacity=".05" stroke-width=".35"/>
        </g>
        <polygon points="-3,40.5 93,40.5 93,53 -3,53" fill="#0b0b0d"/>
        <rect x="-3" y="39.6" width="96" height=".5" fill="#fff" fill-opacity=".85"/>
      </svg>
      <svg class="emblem" viewBox="0 0 100 100" role="img" aria-label="شعار سخان ماء"><use href="#emblem"/></svg>
      <h2 class="name">أبو خديج</h2>
      <p class="motto">لسنا الوحيدين... ولكننا <b>الأفضل</b></p>
    </section>
    <figcaption class="label">الوجه الخلفي</figcaption>
  </figure>

</main>

<footer class="actions">
  <button type="button" onclick="window.print()">طباعة الكرت</button>
  <p>المقاس 9 × 5 سم — ملفات المطبعة في مجلد <code>print</code></p>
</footer>

</body>
</html>
