<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#0327d5">
<title>Madix Net | تم الدخول</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/madix.css">
</head>
<body data-page="alogin">
<div class="app">
  <div class="sky-top">
    <span class="cloud c1" aria-hidden="true"></span>
    <span class="cloud c2" aria-hidden="true"></span>
    <svg class="divider" viewBox="0 0 210 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="22" r="3" fill="currentColor" stroke="none"/><path d="M12 22h50"/><path class="soft" d="M72 16v6M80 12v10M130 12v10M138 16v6"/><path d="M89.4 6.4a22 22 0 0 1 31.2 0M93.7 10.7a16 16 0 0 1 22.6 0M97.9 14.9a10 10 0 0 1 14.2 0"/><circle cx="105" cy="21.5" r="2.4" fill="currentColor" stroke="none"/><path d="M148 22h50"/><circle cx="203" cy="22" r="3" fill="currentColor" stroke="none"/></svg>
  </div>

  <main class="center gutter">
    <div class="ring ok"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>تم تسجيل الدخول بنجاح</h1>
    <p class="lead">أهلاً بك في شبكة <span data-bind="nameAr">ماديكس نت</span>، نتمنى لك تجربة تصفح سريعة وممتعة.</p>
    <p class="who" id="who" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>المستخدم</span><b id="who-name"></b></p>

    <div class="progress" aria-live="polite">
      <div class="progress-row"><span>جاري التحويل تلقائياً...</span><b id="count">4 ثوانٍ</b></div>
      <div class="bar"><i id="bar"></i></div>
    </div>

    <a class="btn btn-primary" id="go" href="$(link-redirect)"><span>اضغط هنا للتحويل الفوري</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
    <a class="btn btn-soft" id="to-status" href="$(link-status)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg><span>عرض حالة الاتصال</span></a>

    <p class="note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span>خدمة إنترنت فائقة السرعة والاستقرار</span></p>
  </main>

  <footer class="mini-foot"><span data-bind="tagline">شبكة ماديكس نت لخدمات الإنترنت</span> - <b data-bind="brand">MADIX NET</b></footer>
</div>

<script>
window.SN_MT = {
  linkRedirect: '$(link-redirect)',
  linkStatus: '$(link-status)',
  username: '$(username)'
};
</script>
<script src="madix-config.js"></script>
<script src="madix.js"></script>
</body>
</html>
