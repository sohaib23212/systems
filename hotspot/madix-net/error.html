<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#0327d5">
<title>Madix Net | تنبيه</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/madix.css">
</head>
<body data-page="error">
<div class="app">
  <div class="sky-top">
    <span class="cloud c1" aria-hidden="true"></span>
    <span class="cloud c2" aria-hidden="true"></span>
    <svg class="divider" viewBox="0 0 210 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="22" r="3" fill="currentColor" stroke="none"/><path d="M12 22h50"/><path class="soft" d="M72 16v6M80 12v10M130 12v10M138 16v6"/><path d="M89.4 6.4a22 22 0 0 1 31.2 0M93.7 10.7a16 16 0 0 1 22.6 0M97.9 14.9a10 10 0 0 1 14.2 0"/><circle cx="105" cy="21.5" r="2.4" fill="currentColor" stroke="none"/><path d="M148 22h50"/><circle cx="203" cy="22" r="3" fill="currentColor" stroke="none"/></svg>
  </div>

  <main class="center gutter">
    <div class="ring warn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
    <h1>تعذّر إكمال الطلب</h1>
    <p class="err-box" id="e-text" role="alert">$(error)</p>
    <p class="lead">تأكد من بياناتك ثم حاول مرة أخرى، أو تواصل مع الدعم الفني إذا تكرر التنبيه.</p>

    <a class="btn btn-primary" id="back" href="$(link-login-only)"><span>العودة لصفحة الدخول</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg></a>
    <a class="btn btn-soft" id="e-call" href="#" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>تواصل مع الدعم الفني</span></a>
  </main>

  <footer class="mini-foot"><span data-bind="tagline">شبكة ماديكس نت لخدمات الإنترنت</span> - <b data-bind="brand">MADIX NET</b></footer>
</div>

<script>
window.SN_MT = {
  error: '$(error)',
  linkLogin: '$(link-login)',
  linkLoginOnly: '$(link-login-only)'
};
</script>
<script src="madix-config.js"></script>
<script src="madix.js"></script>
</body>
</html>
